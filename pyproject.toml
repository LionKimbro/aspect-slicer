[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspect-slicer"
version = "0.1.0"
description = "Tkinter tool for exact-aspect print crop slicing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow",
  "lionscliapp",
  "tkintertester",
]

[project.scripts]
aspect-slicer = "aspect_slicer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

